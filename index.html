<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search 945 licensed Irish recruitment agencies. Filter by county and industry, shortlist the right teams and contact them in minutes.">
  <meta property="og:title" content="CapoLavoro.ie — Find the recruiters who know your industry">
  <meta property="og:description" content="Ireland's recruitment directory. Filter licensed agencies, save the right contacts and prepare your next introduction.">
  <meta property="og:type" content="website">
  <title>CapoLavoro.ie — Find the recruiters who know your industry</title>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Papa Parse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Leaflet + MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand:#0B7B5B; --brand-dark:#075E45; --brand-mid:#12946C; --brand-tint:#E8F5F0; --brand-tint-2:#F1F9F6;
      --ink:#0D2B2A; --ink-2:#14343B; --muted:#647C82; --muted-2:#8CA0A6;
      --line:#E4EDEA; --line-soft:#F0F5F3; --bg:#F7FBFA; --card:#FFFFFF;
      --land:#DCEFE4; --land-line:#B4D8C6; --orange:#E2703A; --pin:#E5484D;
      --radius:14px;
      --shadow:0 1px 2px rgba(13,43,42,.04), 0 8px 24px rgba(13,43,42,.05);
      --shadow-card:0 10px 30px rgba(11,58,48,.10), 0 1px 3px rgba(11,58,48,.06);
      --shadow-lg:0 24px 60px rgba(9,33,30,.18);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
    a{color:inherit;text-decoration:none}
    ::selection{background:#BFE9DA}
    :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
    .shell{max-width:1420px;margin:0 auto;padding:0 28px}
    .mono{font-family:'Space Mono',monospace}

    /* ================= TOP BAR ================= */
    .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
    .topbar-inner{display:flex;align-items:center;gap:26px;height:66px}
    .brand{line-height:1.05}
    .brand h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
    .brand p{font-size:11.5px;color:var(--brand);margin-top:2px;font-weight:500}
    .nav{display:flex;align-items:center;gap:26px;margin:0 auto}
    .nav a{font-size:14px;color:var(--muted);font-weight:500;padding:22px 2px;border-bottom:2px solid transparent;transition:color .15s}
    .nav a:hover{color:var(--ink)}
    .nav a.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
    .top-right{display:flex;align-items:center;gap:12px}
    .top-search{position:relative}
    .top-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
    .top-search input{width:320px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px 0 36px;background:#fff;font-size:13.5px}
    .top-search input::placeholder{color:var(--muted-2)}
    .top-search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,123,91,.10)}
    .btn-tour{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:500;background:#fff}
    .btn-tour:hover{border-color:#BFDCD2}
    .btn-explore{display:flex;align-items:center;gap:9px;height:42px;padding:0 18px;border-radius:10px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 6px 16px rgba(11,123,91,.22)}
    .btn-explore:hover{background:var(--brand-dark)}
    .avatar-wrap{position:relative}
    .avatar-btn{display:flex;align-items:center;gap:6px}
    .avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center}
    .menu{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:210px;z-index:70}
    .menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);text-align:left}
    .menu button:hover{background:var(--brand-tint-2)}
    .menu button:disabled{color:var(--muted-2);cursor:default;background:none}

    /* ================= LANDING ================= */
    .lp-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%, #F4FAF8 58%, #EFF7FA 100%);border-bottom:1px solid var(--line)}
    .lp-hero-bg{
      position:absolute;top:50%;right:-6%;transform:translateY(-50%);width:min(660px,44%);
      pointer-events:none;z-index:0;opacity:.6;
      -webkit-mask-image:linear-gradient(90deg,transparent 0%, rgba(0,0,0,.45) 22%, #000 52%);
      mask-image:linear-gradient(90deg,transparent 0%, rgba(0,0,0,.45) 22%, #000 52%)
    }
    .lp-hero-bg svg{display:block;width:100%;height:auto}
    .lp-inner{position:relative;z-index:1;text-align:center;max-width:880px;margin:0 auto;padding:78px 0 80px}
    .lp-hero h2{font-size:clamp(38px,4.3vw,60px);line-height:1.04;letter-spacing:-2px;font-weight:700}
    .lp-hero h2 em{font-style:normal;color:var(--brand)}
    .search-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-card);padding:18px;margin:38px auto 0;max-width:980px;text-align:left}
    .search-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .sf{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:8px 10px 8px 12px;background:#fff;position:relative}
    .sf:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,123,91,.10)}
    .sf-ico{flex:none;display:flex}
    .sf-body{min-width:0;flex:1}
    .sf-body>span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
    .sf-body select{appearance:none;width:100%;border:none;background:none;font-size:14.5px;font-weight:500;color:var(--ink);padding:1px 16px 0 0;cursor:pointer}
    .sf-body select:focus{outline:none}
    .sf:after{content:"";position:absolute;right:14px;top:calc(50% + 3px);width:7px;height:7px;border-right:1.7px solid var(--muted);border-bottom:1.7px solid var(--muted);transform:translateY(-50%) rotate(45deg);pointer-events:none}
    .search-go{width:100%;height:56px;margin-top:12px;border-radius:11px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:11px;box-shadow:0 8px 20px rgba(11,123,91,.24)}
    .search-go:hover{background:var(--brand-dark)}
    .card-sep{height:1px;background:var(--line-soft);margin:18px -18px}

    .county{fill:var(--land);stroke:var(--land-line);stroke-width:1;stroke-linejoin:round}
    .agency-dot{fill:#2E9E77}
    .city-ring{fill:#0D3B33;stroke:#fff;stroke-width:3}
    .city-label{font-size:19px;font-weight:700;fill:var(--ink);opacity:.8}

    .lp-flow{display:grid;grid-template-columns:repeat(3,1fr);max-width:700px;margin:36px auto 0;text-align:left}
    .lp-flow-top{display:flex;align-items:center;gap:9px}
    .lp-flow-step:not(:last-child) .lp-flow-top:after{content:"";flex:1;height:1px;background:#D6E3DF;margin-left:10px}
    .lp-flow-num{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex:none}
    .lp-flow-top b{font-size:14px;font-weight:700;white-space:nowrap}
    .lp-flow-step>span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:8px;padding-right:16px}
    .ind-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .ind-head b{font-size:13.5px;font-weight:700}
    .ind-all{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--brand);font-weight:500}
    .ind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .ind-card{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;font-size:13px;font-weight:500;line-height:1.25;transition:border-color .15s,transform .15s}
    .ind-card:hover{border-color:#BFDCD2;transform:translateY(-1px)}
    .ind-card svg{flex:none}

    /* ================= AGENCIES VIEW ================= */
    .steps{display:flex;align-items:flex-start;justify-content:center;margin-top:26px}
    .step{display:flex;align-items:flex-start;gap:12px;max-width:250px}
    .step-num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
    .step-txt{text-align:left}
    .step-txt strong{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
    .step-txt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;max-width:180px}
    .step-line{width:56px;height:1px;background:#D6E3DF;margin:17px 14px 0}
    .stats{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px}
    .stat{display:flex;align-items:center;gap:14px;padding:18px 26px}
    .stat + .stat{border-left:1px solid var(--line-soft)}
    .stat-ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none}
    .stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
    .stat span{font-size:13px;color:var(--muted)}

    .grid{display:grid;grid-template-columns:252px minmax(0,1fr) 316px;gap:20px;align-items:start;padding:24px 0 56px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .seg{display:flex;gap:4px;background:#EDF3F1;border:1px solid var(--line);border-radius:11px;padding:4px}
    .seg button{display:flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
    .seg button:hover{color:var(--ink)}
    .seg button.on{background:#fff;color:var(--brand-dark);font-weight:700;box-shadow:0 1px 3px rgba(13,43,42,.12)}
    .seg-sm{padding:3px;border-radius:9px}
    .seg-sm button{height:30px;padding:0 11px;font-size:12.5px;gap:6px}
    .net-wrap{position:relative;padding:14px 16px 14px}
    .net-crumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:2px 4px 12px}
    .net-crumbs button{font-size:12.5px;color:var(--muted);padding:5px 11px;border-radius:8px;background:#F2F7F5;font-weight:500}
    .net-crumbs button:hover{color:var(--ink);background:#E9F2EE}
    .net-crumbs button.on{background:var(--brand);color:#fff;font-weight:700}
    .net-crumbs i{font-style:normal;color:var(--muted-2);font-size:13px}
    .net-count{margin-left:auto;font-size:12px;color:var(--muted-2)}
    .net-pager{margin-left:auto;display:flex;align-items:center;gap:6px}
    .net-pager em{font-style:normal;font-size:12px;color:var(--muted-2)}
    .net-pager button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;
      display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
    .net-pager button:disabled{opacity:.35;cursor:default}
    .net-pager button:not(:disabled):hover{border-color:var(--brand);color:var(--brand)}
    .net-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);
      background:radial-gradient(120% 90% at 54% 50%, #FFFFFF 0%, #F6FBF9 55%, #EFF6F4 100%)}
    .net-stage canvas{display:block;width:100%;touch-action:none}
    .net-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
    .net-tools button{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.92);border:1px solid var(--line);
      color:var(--ink-2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(13,43,42,.08)}
    .net-tools button:hover{border-color:var(--brand);color:var(--brand)}
    .net-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;
      max-width:230px;box-shadow:var(--shadow-lg);z-index:5}
    .net-tip b{display:block;font-size:12.5px;font-weight:700;line-height:1.3}
    .net-tip span{display:block;font-size:11px;opacity:.78;margin-top:2px}
    .net-tip em{display:block;font-style:normal;font-size:10.5px;color:#8FE3C2;margin-top:5px}
    .net-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 4px 2px}
    .net-key{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
    .net-key i{width:8px;height:8px;border-radius:50%;display:block}
    .net-hint{margin-left:auto;color:var(--muted-2);font-size:11.5px}
    .col{display:flex;flex-direction:column;gap:18px}
    .col-side{align-self:stretch}
    .sticky{
      position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;
      overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#CBDDD7 transparent
    }
    .sticky::-webkit-scrollbar{width:8px}
    .sticky::-webkit-scrollbar-thumb{background:#CBDDD7;border-radius:8px}
    .sticky::-webkit-scrollbar-track{background:transparent}

    .filters{padding:20px 18px}
    .filters-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
    .filters-head h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
    .link-clear{font-size:12.5px;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:2px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
    .select-wrap{position:relative}
    .select-wrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
    .select-wrap select{appearance:none;width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 30px 0 36px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
    .select-wrap:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
    .select-wrap select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,123,91,.10)}
    .filters h4{font-size:13.5px;font-weight:700;margin:20px 0 10px}
    .check{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;color:var(--ink-2);cursor:pointer}
    .check input{appearance:none;width:17px;height:17px;border:1.6px solid #C9D8D3;border-radius:5px;background:#fff;flex:none;cursor:pointer;position:relative;transition:.12s}
    .check input:checked{background:var(--brand);border-color:var(--brand)}
    .check input:checked:after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
    .divider{height:1px;background:var(--line-soft);margin:16px 0}
    .map-title{font-size:13.5px;font-weight:700;margin-bottom:10px}
    #map{height:196px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#DDEBE6}
    .leaflet-container{font-family:'DM Sans',sans-serif}
    .cluster-pin{background:var(--brand);color:#fff;border-radius:50%;display:flex!important;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;box-shadow:0 0 0 5px rgba(11,123,91,.22)}
    .dot-pin{background:var(--brand-mid);width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(18,148,108,.25)}
    .leaflet-control-zoom a{border-radius:7px!important;color:var(--ink)!important;font-weight:500}

    .results-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
    .results-head h3{font-size:19px;font-weight:700;letter-spacing:-.4px}
    .results-head p{font-size:12.5px;color:var(--muted);margin-top:1px}
    .head-tools{display:flex;align-items:center;gap:12px}
    .sort-lbl{font-size:12.5px;color:var(--muted)}
    .sort-wrap{position:relative}
    .sort-wrap select{appearance:none;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 30px 0 12px;font-size:13px;font-weight:500}
    .sort-wrap:after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
    .pager{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
    .pager button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink-2)}
    .pager button:disabled{opacity:.35;cursor:default}
    .pager button:not(:disabled):hover{border-color:var(--brand);color:var(--brand)}

    table{width:100%;border-collapse:collapse}
    thead th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line-soft);background:#fff}
    thead th:first-child{padding-left:18px;width:42px}
    tbody td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
    tbody td:first-child{padding-left:18px}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:#FAFDFC}
    tbody tr.picked{background:var(--brand-tint-2)}
    .ag-name{font-size:14px;font-weight:700;letter-spacing:-.1px}
    .ag-lic{font-size:11.5px;color:var(--muted-2);margin-top:2px}
    .cell-loc{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
    .pill-more{font-size:11.5px;color:var(--muted-2);margin-left:6px}
    .cell-contact{display:flex;flex-direction:column;gap:4px}
    .contact-line{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
    .web-link{display:flex;align-items:center;gap:7px;font-size:13.5px;color:#3A6FD8}
    .web-link:hover{text-decoration:underline}
    .quality{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 10px;border-radius:999px;font-size:12.5px;font-weight:500}
    .quality i{width:7px;height:7px;border-radius:50%;display:block}
    .q-high{background:#E7F6EF;color:#0B6B4F} .q-high i{background:#12A374}
    .q-good{background:#EDF7F1;color:#3C7A55} .q-good i{background:#5CB87F}
    .q-medium{background:#FDF0E4;color:#B0561F} .q-medium i{background:#EE8B3C}
    .q-none{background:#F1F5F4;color:#7C8F94} .q-none i{background:#B9C7C4}
    .kebab{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .kebab:hover{background:var(--line-soft);color:var(--ink)}
    .row-menu-wrap{position:relative}
    .empty{padding:56px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

    .tpl{padding:18px}
    .tpl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
    .tpl-head h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
    .tpl-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
    .tpl-all{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);font-weight:500}
    .tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .tpl-card{border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;gap:10px;text-align:left;transition:border-color .15s, box-shadow .15s;background:#fff}
    .tpl-card:hover{border-color:#BFDCD2}
    .tpl-card.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(11,123,91,.12)}
    .tpl-ico{width:26px;height:26px;border-radius:7px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;flex:none}
    .tpl-card b{display:block;font-size:13.5px;font-weight:700;margin-bottom:3px}
    .tpl-card small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
    .badge-rec{background:#FBE6D8;color:#B0561F;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}

    .out{padding:18px 16px}
    .out-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
    .out-head h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
    .count-badge{background:var(--brand-tint);color:var(--brand-dark);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
    .out-clear{margin-left:auto;font-size:12.5px;color:var(--orange);font-weight:500}
    .out-clear:hover{text-decoration:underline}
    .out-list{max-height:min(330px, calc(100vh - 430px));min-height:96px;overflow-y:auto;margin:0 -4px;scrollbar-width:thin}
    .out-item{display:flex;align-items:flex-start;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
    .out-item:last-child{border-bottom:none}
    .out-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
    .out-item b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.1px}
    .out-item span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
    .out-x{color:var(--muted-2);padding:2px;margin-left:auto;flex:none}
    .out-x:hover{color:var(--ink)}
    .out-empty{border:1px dashed #CFE0DA;border-radius:11px;padding:22px 14px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5}
    .dedupe{display:flex;gap:9px;background:var(--brand-tint-2);border:1px solid #D9EDE5;border-radius:11px;padding:11px;margin-top:14px}
    .dedupe b{display:block;font-size:12.5px;font-weight:700;color:#0B6B4F}
    .dedupe span{display:block;font-size:11.5px;color:#4E7A6E;line-height:1.4;margin-top:2px}
    .btn{width:100%;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:700;transition:.15s}
    .btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(11,123,91,.22)}
    .btn-primary:hover{background:var(--brand-dark)}
    .btn-primary:disabled{background:#B4CFC6;box-shadow:none;cursor:default}
    .btn-ghost{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand)}
    .btn-ghost:hover{background:var(--brand-tint-2)}
    .btn-ghost:disabled{color:#9FB8B1;border-color:#CFE0DA;cursor:default}
    .out-actions{margin-top:14px;display:flex;flex-direction:column;gap:10px}

    /* ================= PAGES ================= */
    .page{padding:44px 0 56px}
    .page-head{max-width:720px;margin-bottom:26px}
    .page-head .eyebrow{margin-bottom:12px}
    .page-head h2{font-size:clamp(30px,3.2vw,42px);font-weight:700;letter-spacing:-1.4px;line-height:1.1}
    .page-head p{margin-top:12px;font-size:17px;color:var(--muted);line-height:1.55}
    .page-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .page-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
    .page-card h3{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:9px}
    .page-card p{font-size:13.5px;color:var(--muted);line-height:1.6}
    .page-card a.inline{color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:2px}
    .page-cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
    .cta-primary{display:flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:11px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(11,123,91,.22)}
    .cta-primary:hover{background:var(--brand-dark)}
    .cta-ghost{display:flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:11px;border:1.5px solid var(--brand);color:var(--brand-dark);font-weight:700;font-size:15px;background:#fff}
    .cta-ghost:hover{background:var(--brand-tint-2)}
    .sec-title{font-size:22px;font-weight:700;letter-spacing:-.6px;margin:40px 0 6px}
    .sec-sub{font-size:14.5px;color:var(--muted);margin-bottom:18px;max-width:74ch;line-height:1.6}
    .page .steps{justify-content:flex-start;margin:18px 0 0}
    .tpl-res{display:block;transition:border-color .15s,transform .15s}
    .tpl-res:hover{border-color:#BFDCD2;transform:translateY(-1px)}

    /* ================= MODALS ================= */
    .overlay{position:fixed;inset:0;background:rgba(9,33,30,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:90}
    .modal{background:#fff;border-radius:16px;width:100%;max-width:660px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
    .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{font-size:17px;font-weight:700}
    .modal-body{padding:18px 20px;overflow-y:auto}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .tab{padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:500}
    .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
    .modal-body label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
    .modal-body input[type=text],.modal-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13.5px;background:#FBFDFC;resize:vertical}
    .modal-body textarea{min-height:230px;line-height:1.6}
    .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
    .btn-sm{height:40px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}

    /* ================= TOUR ================= */
    .tour-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,30,26,.62), 0 0 0 3px rgba(255,255,255,.85);pointer-events:none;z-index:100;transition:all .28s cubic-bezier(.4,0,.2,1)}
    .tour-badge{position:fixed;z-index:101;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--brand-dark);border:2px solid var(--brand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.2)}
    .tour-card{position:fixed;z-index:102;width:356px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);transition:all .28s cubic-bezier(.4,0,.2,1)}
    .tour-top{background:var(--brand);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
    .tour-top .mono{font-size:13px;font-weight:700}
    .tour-dots{display:flex;gap:7px;margin:0 auto}
    .tour-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.42);display:block}
    .tour-dots i.on{background:#fff;transform:scale(1.15)}
    .tour-body{padding:16px 18px 18px}
    .tour-body h4{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-bottom:8px}
    .tour-body p{font-size:13.5px;color:var(--muted);line-height:1.5}
    .tour-actions{display:flex;gap:10px;margin-top:18px}
    .tour-back{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
    .tour-back:disabled{color:#B6C6C2;cursor:default}
    .tour-next{flex:1;height:44px;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
    .tour-next:hover{background:var(--brand-dark)}
    .tour-skip{display:block;margin:12px auto 0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}

    .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:120;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:rise .2s ease-out}
    @keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
    .loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:38px;height:38px;border:3px solid #D8E9E3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ================= FOOTER ================= */
    footer{background:#F4F9F7;border-top:1px solid var(--line);padding:38px 0 30px}
    .foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
    .foot-grid h4{font-size:13px;font-weight:700;margin-bottom:10px}
    .foot-grid a,.foot-grid p{display:block;font-size:13px;color:var(--muted);line-height:1.9;text-align:left}
    .foot-grid a:hover{color:var(--brand)}
    .foot-brand p{max-width:34ch;line-height:1.6;margin-top:8px}
    .foot-base{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted-2);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

    @media (max-width:1240px){
      .grid{grid-template-columns:236px minmax(0,1fr)}
      .col-right{grid-column:1 / -1;align-self:auto}
      .col-right .sticky{position:static;max-height:none;overflow:visible}
      .out-list{max-height:330px}
      .nav{display:none}
      .top-search input{width:220px}
    }
    @media (max-width:1180px){
      .lp-hero-bg{width:56%;right:-14%;opacity:.4}
      .lp-inner{padding:64px 0 66px}
    }
    @media (max-width:900px){
      .shell{padding:0 16px}
      .grid{grid-template-columns:1fr;padding-top:16px}
      .sticky{position:static;max-height:none;overflow:visible}
      .steps{flex-wrap:wrap;gap:16px;justify-content:flex-start}
      .step-line{display:none}
      .lp-flow{grid-template-columns:1fr 1fr;gap:18px 0}
      .lp-flow-step:not(:last-child) .lp-flow-top:after{display:none}
      .step{max-width:none;flex:1 1 240px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .stat:nth-child(3){border-left:none}
      .stat:nth-child(n+3){border-top:1px solid var(--line-soft)}
      .tpl-grid{grid-template-columns:1fr 1fr}
      .table-scroll{overflow-x:auto}
      table{min-width:820px}
      .top-search{display:none}
      .tour-card{width:min(356px,calc(100vw - 32px))}
      .search-fields{grid-template-columns:1fr}
      .ind-grid{grid-template-columns:1fr 1fr}
      .btn-tour span,.btn-explore span{display:none}
      .lp-hero-bg{display:none}
      .lp-inner{padding:48px 0 52px}
      .foot-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>

            push({
              id:c.id, kind:c.kind, label:c.label, agency:c.agency, r:7, side,

          const sizes = ch.map(c => Math.max(17, Math.min(34, 12 + Math.sqrt(c.count || 1) * 2.6)));

          const radii = ringCount === 1 ? [maxR * 0.9]

            : [maxR * 0.46, maxR * 0.74, maxR];
          const perRing = [];
          for (let i = 0; i < ringCount; i++) perRing.push(0);
          ch.forEach((_, i) => perRing[i % ringCount]++);
          const cursor = perRing.map(() => 0);
          ch.forEach((c, i) => {
            const ring = i % ringCount;
            const idx = cursor[ring]++;
            const cnt = perRing[ring];
            const offset = ring * 0.42 + (ringCount > 1 ? 0.18 : 0);
            const ang = (idx / cnt) * Math.PI * 2 - Math.PI / 2 + offset;
            const rad = radii[ring];
            push({
              id:c.id, kind:c.kind, label:c.label, count:c.count, agency:c.agency,
              r:sizes[i], ang, share:(c.count || 0) / total,
              tx:cx + Math.cos(ang) * rad, ty:cy + Math.sin(ang) * rad * squash
            });
            links.push({ s:'center', t:c.id, kind:'branch' });
          });
          ringsOut = radii.slice(0, ringCount);
        }

        simRef.current = {
          nodes, links, byId:Object.fromEntries(nodes.map(x => [x.id, x])),
          rings:ringsOut, cx, cy, leaf
        };
      }, [view, size.w, size.h]);

      /* ---------- render loop ---------- */
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const W = size.w, H = size.h;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        let raf, t0 = performance.now();

        const halo = (x, y, text, font, fill) => {
          ctx.font = font;
          const w = ctx.measureText(text).width;
          ctx.fillStyle = 'rgba(255,255,255,.82)';
          const pad = 5;
          ctx.beginPath();
          const rx = x - w/2 - pad, ry = y - 9, rw = w + pad*2, rh = 17, rr = 6;
          ctx.moveTo(rx + rr, ry);
          ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rr);
          ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rr);
          ctx.arcTo(rx, ry + rh, rx, ry, rr);
          ctx.arcTo(rx, ry, rx + rw, ry, rr);
          ctx.fill();
          ctx.fillStyle = fill;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(text, x, y);
        };
        const clip = (str, max) => str.length > max ? str.slice(0, max - 1) + '…' : str;

        const frame = (now) => {
          const S = simRef.current;
          const { nodes, links, byId } = S;
          const v = viewRef.current;
          const t = (now - t0) / 1000;

          nodes.forEach(n => {
            if (!n.pinned) { n.x += (n.tx - n.x) * 0.16; n.y += (n.ty - n.y) * 0.16; }
            n.alpha += (1 - n.alpha) * 0.12;
          });

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          ctx.translate(v.tx, v.ty); ctx.scale(v.k, v.k);

          /* orbit guides */
          (S.rings || []).forEach((r, i) => {
            ctx.beginPath();
            ctx.ellipse(S.cx, S.cy, r, r * 0.88, 0, 0, 6.284);
            ctx.strokeStyle = 'rgba(11,123,91,' + (0.09 - i * 0.022) + ')';
            ctx.lineWidth = 1; ctx.setLineDash([4, 7]); ctx.stroke(); ctx.setLineDash([]);
          });

          const hov = hoverRef.current;
          const dim = hov ? 0.30 : 1;

          /* links */
          links.forEach(l => {
            const b = byId[l.t];
            const a = l.s ? byId[l.s] : null;
            if (!b) return;
            const from = a || { x:b.x - 40, y:b.y };
            const lit = hov && (hov === l.t || hov === l.s);
            ctx.beginPath();
            if (l.kind === 'leaf' && l.side) {
              const sx = from.x + l.side * (from.r || 30) * 0.9, sy = from.y;
              const ex = b.x - l.side * (b.r + 2);
              ctx.moveTo(sx, sy);
              ctx.bezierCurveTo(sx + l.side * 70, sy, ex - l.side * 80, b.y, ex, b.y);
            } else {
              ctx.moveTo(from.x, from.y);
              const mx = (from.x + b.x) / 2 + (b.y - from.y) * 0.14;
              const my = (from.y + b.y) / 2 - (b.x - from.x) * 0.14;
              ctx.quadraticCurveTo(mx, my, b.x, b.y);
            }
            if (l.kind === 'trail') {
              ctx.setLineDash([3, 6]);
              ctx.strokeStyle = 'rgba(100,124,130,' + (0.5 * (hov ? dim : 1)) + ')';
              ctx.lineWidth = 1.2;
            } else {
              const g = ctx.createLinearGradient(from.x, from.y, b.x, b.y);
              const op = (lit ? 0.85 : 0.34 * (hov ? dim : 1)) * b.alpha;
              g.addColorStop(0, 'rgba(11,123,91,' + op + ')');
              g.addColorStop(1, 'rgba(18,148,108,' + (op * 0.5) + ')');
              ctx.strokeStyle = g;
              ctx.lineWidth = l.kind === 'branch' ? (lit ? 2.4 : 1.5) : (lit ? 2 : 1.1);
            }
            ctx.stroke();
            ctx.setLineDash([]);
          });

          /* nodes */
          nodes.forEach(n => {
            const lit = hov === n.id;
            const fade = hov && !lit ? dim : 1;
            const A = n.alpha * fade;
            const r = n.r * (lit ? 1.09 : 1);

            if (n.kind === 'hub' || n.kind === 'center') {
              const pulse = 1 + Math.sin(t * 1.6) * 0.02;
              ctx.beginPath(); ctx.arc(n.x, n.y, r * 1.55 * pulse, 0, 6.284);
              ctx.fillStyle = 'rgba(11,123,91,.07)'; ctx.fill();
              ctx.beginPath(); ctx.arc(n.x, n.y, r * 1.22, 0, 6.284);
              ctx.fillStyle = 'rgba(11,123,91,.10)'; ctx.fill();
              ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284);
              ctx.fillStyle = '#0B7B5B'; ctx.fill();
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.font = '700 13px DM Sans, sans-serif';
              const maxW = r * 2 - 18;
              const words = n.label.split(' ');
              let lines = [n.label];
              if (ctx.measureText(n.label).width > maxW && words.length > 1) {
                const half = Math.ceil(words.length / 2);
                lines = [words.slice(0, half).join(' '), words.slice(half).join(' ')];
              }
              const fits = lines.every(l => ctx.measureText(l).width <= maxW);
              if (fits) {
                ctx.fillStyle = '#fff';
                lines.forEach((l, i) => ctx.fillText(l, n.x, n.y - (lines.length > 1 ? 9 - i * 16 : 5)));
                ctx.font = '500 10.5px DM Sans, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,.75)';
                ctx.fillText(n.count + ' agencies', n.x, n.y + (lines.length > 1 ? 20 : 11));
              } else {
                ctx.fillStyle = '#fff';
                ctx.font = '700 19px DM Sans, sans-serif';
                ctx.fillText(String(n.count), n.x, n.y - 5);
                ctx.font = '500 10.5px DM Sans, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,.75)';
                ctx.fillText('agencies', n.x, n.y + 12);
                halo(n.x, n.y + r + 20, clip(n.label, 26), '700 13px DM Sans, sans-serif', '#0D2B2A');
              }
              return;
            }

            if (n.kind === 'ancestor') {
              ctx.globalAlpha = A * 0.9;
              ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284);
              ctx.fillStyle = lit ? '#0B7B5B' : '#E3F1EB'; ctx.fill();
              ctx.lineWidth = 1.6; ctx.strokeStyle = '#B4D8C6'; ctx.stroke();
              ctx.fillStyle = '#4A6B66'; ctx.font = '500 11px DM Sans, sans-serif';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(clip(n.label, 14), n.x, n.y + r + 12);
              ctx.globalAlpha = 1;
              return;
            }

            if (n.kind === 'cluster') {
              ctx.globalAlpha = A;
              ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284);
              ctx.fillStyle = lit ? '#0B7B5B' : '#FFFFFF'; ctx.fill();
              ctx.lineWidth = 1.6; ctx.strokeStyle = lit ? '#075E45' : '#CFE7DC'; ctx.stroke();
              /* share gauge */
              ctx.beginPath(); ctx.arc(n.x, n.y, r + 5, 0, 6.284);
              ctx.strokeStyle = 'rgba(11,123,91,.10)'; ctx.lineWidth = 3; ctx.stroke();
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 5, -Math.PI/2, -Math.PI/2 + Math.max(0.16, n.share * 6.284));
              ctx.strokeStyle = lit ? '#0B7B5B' : 'rgba(11,123,91,.6)';
              ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
              ctx.fillStyle = lit ? '#fff' : '#0B6B4F';
              ctx.font = '700 13px DM Sans, sans-serif';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(String(n.count), n.x, n.y);
              halo(n.x, n.y + r + 20, clip(n.label, 18), '600 12px DM Sans, sans-serif', '#0D2B2A');
              ctx.globalAlpha = 1;
              return;
            }

            /* agency */
            const on = selRef.current.includes(n.agency._k);
            const q = qualityOf(n.agency);
            ctx.globalAlpha = A;
            if (on) {
              ctx.beginPath(); ctx.arc(n.x, n.y, r + 5, 0, 6.284);
              ctx.fillStyle = 'rgba(11,123,91,.14)'; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284);
            ctx.fillStyle = on ? '#0B7B5B' : '#fff'; ctx.fill();
            ctx.lineWidth = 2.2; ctx.strokeStyle = on ? '#075E45' : QUALITY_DOT[q.key]; ctx.stroke();
            if (on) {
              ctx.beginPath();
              ctx.moveTo(n.x - 3.2, n.y); ctx.lineTo(n.x - 0.8, n.y + 2.6); ctx.lineTo(n.x + 3.4, n.y - 2.6);
              ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
            }
            const side = n.side || 1;
            ctx.font = (lit || on ? '700 ' : '500 ') + '11.5px DM Sans, sans-serif';
            ctx.fillStyle = lit ? '#0D2B2A' : on ? '#0B6B4F' : '#4A6B66';
            ctx.textAlign = side < 0 ? 'right' : 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(clip(n.label, lit ? 34 : 26), n.x + side * (r + 9), n.y);
            ctx.textAlign = 'center';
            ctx.globalAlpha = 1;
          });

          ctx.restore();
          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [size.w, size.h]);

      /* ---------- pointer ---------- */
      const toWorld = (e) => {
        const r = canvasRef.current.getBoundingClientRect();
        const v = viewRef.current;
        return { x:(e.clientX - r.left - v.tx) / v.k, y:(e.clientY - r.top - v.ty) / v.k,
                 sx:e.clientX - r.left, sy:e.clientY - r.top };
      };
      const nodeAt = (x, y) => {
        const { nodes } = simRef.current;
        for (let i = nodes.length - 1; i >= 0; i--) {
          const n = nodes[i];
          if (Math.hypot(n.x - x, n.y - y) <= n.r + 7) return n;
        }
        return null;
      };
      const onMove = (e) => {
        const pt = toWorld(e);
        const d = dragRef.current;
        if (d && d.node) {
          const n = simRef.current.byId[d.node];
          if (n) { n.x = n.tx = pt.x; n.y = n.ty = pt.y; n.pinned = true; }
          d.moved = true; return;
        }
        if (d && d.pan) {
          viewRef.current.tx = d.tx0 + (e.clientX - d.x0);
          viewRef.current.ty = d.ty0 + (e.clientY - d.y0);
          d.moved = true; return;
        }
        const n = nodeAt(pt.x, pt.y);
        hoverRef.current = n ? n.id : null;
        canvasRef.current.style.cursor = n ? 'pointer' : 'grab';
        if (!n) return setTip(null);
        if (n.kind === 'agency') {
          const q = qualityOf(n.agency);
          const on = selRef.current.includes(n.agency._k);
          setTip({ x:pt.sx, y:pt.sy, name:shortName(n.agency),
                   sub:(n.agency.County || '') + ' · ' + (q.key === 'none' ? 'no email on file' : q.label.toLowerCase() + ' quality email'),
                   hint:on ? 'Click to remove from your list' : 'Click to add to your outreach list' });
        } else if (n.kind === 'cluster') {
          setTip({ x:pt.sx, y:pt.sy, name:n.label, sub:n.count + ' agencies', hint:'Click to open' });
        } else if (n.kind === 'ancestor') {
          setTip({ x:pt.sx, y:pt.sy, name:n.label, sub:'', hint:'Click to go back' });
        } else if (n.kind === 'center' || n.kind === 'hub') {
          setTip({ x:pt.sx, y:pt.sy, name:n.label, sub:n.count + ' agencies', hint:path.length ? 'Click to go back' : '' });
        }
      };
      const onDown = (e) => {
        const pt = toWorld(e);
        const n = nodeAt(pt.x, pt.y);
        dragRef.current = n
          ? { node:n.id, moved:false }
          : { pan:true, x0:e.clientX, y0:e.clientY, tx0:viewRef.current.tx, ty0:viewRef.current.ty, moved:false };
      };
      const onUp = (e) => {
        const d = dragRef.current;
        dragRef.current = null;
        if (!d || d.moved) return;
        const pt = toWorld(e);
        const n = nodeAt(pt.x, pt.y);
        if (!n) return;
        if (n.kind === 'cluster') setPath(p => [...p, n.label]);
        else if (n.kind === 'agency') onToggle(n.agency._k);
        else if (n.kind === 'ancestor') setPath(p => p.slice(0, n.depth));
        else if (n.kind === 'center') setPath(p => p.slice(0, -1));
      };
      const onWheel = (e) => {
        e.preventDefault();
        const r = canvasRef.current.getBoundingClientRect();
        const v = viewRef.current;
        const k = Math.max(0.55, Math.min(2.6, v.k * Math.exp(-e.deltaY * 0.0014)));
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        v.tx = mx - (mx - v.tx) * (k / v.k);
        v.ty = my - (my - v.ty) * (k / v.k);
        v.k = k;
      };
      const zoom = (f) => {
        const v = viewRef.current;
        const k = Math.max(0.55, Math.min(2.6, v.k * f));
        const mx = size.w / 2, my = size.h / 2;
        v.tx = mx - (mx - v.tx) * (k / v.k);
        v.ty = my - (my - v.ty) * (k / v.k);
        v.k = k; force(x => x + 1);
      };
      const resetView = () => {
        viewRef.current = { k:1, tx:0, ty:0 };
        simRef.current.nodes.forEach(n => { n.pinned = false; });
        force(x => x + 1);
      };

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape' && path.length) setPath(p => p.slice(0, -1)); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [path.length]);

      const crumbs = [view.center.kind === 'hub' ? view.center.label : (county || (groupMode === 'industry' ? 'Industries' : 'All Ireland')), ...path];

      return (
        <div className="net-wrap" ref={wrapRef}>
          <div className="net-crumbs">
            {crumbs.map((c, i) => (
              <React.Fragment key={c + i}>
                {i > 0 && <i>›</i>}
                <button className={i === crumbs.length - 1 ? 'on' : ''} onClick={() => setPath(p => p.slice(0, i))}>{c}</button>
              </React.Fragment>
            ))}
            {view.childKind === 'agency' && view.total > pageSize ? (
              <span className="net-pager">
                <button onClick={() => setLeafPage(x => Math.max(0, x - 1))} disabled={leafPage === 0} aria-label="Previous agencies">{I.chevL()}</button>
                <em>{view.from + 1}–{view.from + view.children.length} of {view.total}</em>
                <button onClick={() => setLeafPage(x => x + 1)} disabled={view.from + view.children.length >= view.total} aria-label="More agencies">{I.chevR({s:15})}</button>
              </span>
            ) : (
              <span className="net-count">
                {view.childKind === 'agency'
                  ? view.children.length + ' agencies'
                  : view.children.length + (groupMode === 'industry' && !path.length ? ' industries' : ' counties')}
              </span>
            )}
          </div>

          <div className="net-stage">
            <canvas
              ref={canvasRef}
              onMouseMove={onMove} onMouseDown={onDown} onMouseUp={onUp} onWheel={onWheel}
              onMouseLeave={() => { dragRef.current = null; hoverRef.current = null; setTip(null); }}
            />
            <div className="net-tools">
              <button onClick={() => zoom(1.25)} aria-label="Zoom in">+</button>
              <button onClick={() => zoom(0.8)} aria-label="Zoom out">−</button>
              <button onClick={resetView} aria-label="Reset view" title="Reset view">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 9a8 8 0 0 1 13.5-3.5L20 8"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-13.5 3.5L4 16"/><path d="M4 20v-4h4"/></svg>
              </button>
            </div>
            {tip && (
              <div className="net-tip" style={{ left:Math.min(size.w - 200, tip.x + 16), top:Math.max(4, tip.y - 54) }}>
                <b>{tip.name}</b>
                {tip.sub && <span>{tip.sub}</span>}
                {tip.hint && <em>{tip.hint}</em>}
              </div>
            )}
          </div>

          <div className="net-legend">
            <span className="net-key"><i style={{background:QUALITY_DOT.high}}></i>High</span>
            <span className="net-key"><i style={{background:QUALITY_DOT.good}}></i>Good</span>
            <span className="net-key"><i style={{background:QUALITY_DOT.medium}}></i>Medium</span>
            <span className="net-key"><i style={{background:QUALITY_DOT.none}}></i>No email</span>
            <span className="net-hint">
              {groupMode === 'industry' ? 'Industry → county → agency' : 'County → agency'} · click to drill in, Esc to go back · scroll to zoom, drag the background to pan
            </span>
          </div>
        </div>
      );
    };

    /* =========================================================
       Tour
    ========================================================= */
    const TOUR_STEPS = [
      { target:'filters',  title:'Start with your search',     body:(n) => `Choose a county and industry to narrow ${n} licensed agencies to the recruiters most relevant to you.` },
      { target:'results',  title:'Pick the agencies you want', body:() => 'Tick any row to add it to your outreach list. Email quality tells you how direct the address is before you write.' },
      { target:'outreach', title:'Your outreach list',         body:() => 'Every agency you tick lands here, with duplicate addresses removed automatically.' },
      { target:'copy',     title:'Copy, then start writing',   body:() => 'Copy every address at once for the BCC field, or export the full selection as a CSV.' }
    ];

    const Tour = ({ step, total, onNext, onBack, onClose, count }) => {
      const [rects, setRects] = useState(null);

      const measure = useCallback(() => {
        const out = {};
        TOUR_STEPS.forEach((s, i) => {
          const el = document.querySelector('[data-tour="' + s.target + '"]');
          if (el) {
            const r = el.getBoundingClientRect();
            out[i] = { top:r.top, left:r.left, width:r.width, height:r.height, bottom:r.bottom, right:r.right };
          }
        });
        setRects(out);
      }, []);

      useEffect(() => {
        const el = document.querySelector('[data-tour="' + TOUR_STEPS[step].target + '"]');
        if (el) el.scrollIntoView({ block:'center', behavior:'smooth' });
        const t = setTimeout(measure, 320);
        window.addEventListener('resize', measure);
        window.addEventListener('scroll', measure, true);
        return () => { clearTimeout(t); window.removeEventListener('resize', measure); window.removeEventListener('scroll', measure, true); };
      }, [step, measure]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') onClose();
          if (e.key === 'ArrowRight') onNext();
          if (e.key === 'ArrowLeft') onBack();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose, onNext, onBack]);

      if (!rects || !rects[step]) return <div className="overlay" onClick={onClose}></div>;

      const r = rects[step], pad = 10;
      const vw = window.innerWidth, vh = window.innerHeight;
      const W = Math.min(356, vw - 32), H = 300;
      let left;
      if (r.right + 26 + W < vw) left = r.right + 26;
      else if (r.left - 26 - W > 0) left = r.left - 26 - W;
      else left = Math.max(16, Math.min(vw - W - 16, r.left + r.width/2 - W/2));
      const top = Math.max(16, Math.min(vh - H - 16, r.top + Math.min(60, r.height/2 - 40)));

      return (
        <>
          <div style={{position:'fixed',inset:0,zIndex:99}} onClick={(e) => e.stopPropagation()}></div>
          <div className="tour-spot" style={{ top:r.top - pad, left:r.left - pad, width:r.width + pad*2, height:r.height + pad*2 }}></div>

          {TOUR_STEPS.map((s, i) => {
            if (i === step || !rects[i]) return null;
            const b = rects[i];
            const rightSide = b.left > vw * 0.6;
            return (
              <div key={s.target} className="tour-badge" style={{
                top:Math.max(8, b.top - 14),
                left:rightSide ? Math.min(vw - 38, b.right - 16) : Math.max(8, b.left - 15)
              }}>{i + 1}</div>
            );
          })}

          <div className="tour-card" style={{ top, left, width:W }} role="dialog" aria-label="Product tour">
            <div className="tour-top">
              <span className="mono">{step + 1} of {total}</span>
              <div className="tour-dots">{TOUR_STEPS.map((_, i) => <i key={i} className={i === step ? 'on' : ''}></i>)}</div>
              <button onClick={onClose} aria-label="Close tour" style={{color:'#fff',display:'flex'}}>{I.x({s:16,c:'#fff'})}</button>
            </div>
            <div className="tour-body">
              <h4>{TOUR_STEPS[step].title}</h4>
              <p>{TOUR_STEPS[step].body(count)}</p>
              <div className="tour-actions">
                <button className="tour-back" onClick={onBack} disabled={step === 0}>Back</button>
                <button className="tour-next" onClick={onNext}>{step === total - 1 ? 'Finish' : 'Next'} {I.arrow({s:16})}</button>
              </div>
              <button className="tour-skip" onClick={onClose}>Skip tour</button>
            </div>
          </div>
        </>
      );
    };

    /* =========================================================
       Template modal
    ========================================================= */
    const TemplateModal = ({ open, onClose, templateId, setTemplateId, picked, toast }) => {
      const tpl = TEMPLATES.find(t => t.id === templateId) || TEMPLATES[0];
      const first = picked[0];
      const fill = (s) => s
        .replace(/{{agency}}/g, first ? shortName(first) : 'there')
        .replace(/{{county}}/g, first ? (first.County || 'Ireland') : 'Ireland')
        .replace(/{{field}}/g, first ? (fieldsOf(first)[0] || 'your sectors') : 'your sectors')
        .replace(/{{me}}/g, 'Your name');

      const [subject, setSubject] = useState(fill(tpl.subject));
      const [body, setBody] = useState(fill(tpl.body));
