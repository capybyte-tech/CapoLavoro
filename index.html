    /* =========================================================
       App
    ========================================================= */
    const PER_PAGE = 50;

    const App = () => {
      const [agencies, setAgencies] = useState([]);
      const [loading, setLoading] = useState(true);
      const [route, setRoute] = useState(readHash());

      /* landing search box */
      const [homeFilters, setHomeFilters] = useState({ county:'', industry:'', contact:'email' });

      /* agencies view state */
      const [county, setCounty] = useState('');
      const [industry, setIndustry] = useState('');
      const [term, setTerm] = useState('');
      const [dTerm, setDTerm] = useState('');
      const [hasEmail, setHasEmail] = useState(false);
      const [hasPhone, setHasPhone] = useState(false);
      const [hasWebsite, setHasWebsite] = useState(false);
      const [sort, setSort] = useState('relevance');
      const [viewMode, setViewMode] = useState('list');
      const [netGroup, setNetGroup] = useState('county');
      const [page, setPage] = useState(0);
      const [selected, setSelected] = useState([]);
      const [rowMenu, setRowMenu] = useState(null);
      const [userMenu, setUserMenu] = useState(false);
      const [templateId, setTemplateId] = useState('intro');
      const [tplOpen, setTplOpen] = useState(false);
      const [tourStep, setTourStep] = useState(null);
      const [msg, setMsg] = useState(null);
      const appliedHash = useRef('');

      const toast = useCallback((t) => { setMsg(t); setTimeout(() => setMsg(null), 2400); }, []);

      /* ---- routing ---- */
      useEffect(() => {
        const onHash = () => { setRoute(readHash()); window.scrollTo({ top:0, behavior:'auto' }); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      /* ---- data ---- */
      useEffect(() => {
        const fallback = `County;Agency_Name;Trading_Name;Address;Licence_Number;Phone;Email;Website;Covered_Fields
Carlow;Care Network Ireland Ltd;;36 Dublin Street Co. Carlow;EA4373;353868517366;;https://www.carenetworkireland.ie;Care & Healthcare
Dublin;Excel Recruitment;;South County Business Park Dublin 18;EA3987;018256300;barry@excelrecruitment.com;https://excelrecruitment.com;Engineering
Dublin;FRS Recruitment;;Roscrea Co. Tipperary;EA3150;018397000;colin@frsrecruitment.com;https://frsrecruitment.com;IT & Tech
Dublin;Hays Ireland;;2 Park Place Citywest;EA2804;016364800;hays.ireland@gmail.com;https://hays.ie;Finance
Dublin;Morgan McKinley;;30 Herbert Street Dublin 2;EA3291;014321000;deirdre@morganmckinley.ie;https://morganmckinley.ie;Professional Services
Cork;CPL Resources;;83 South Mall Cork;EA1089;0214271444;cork@cpl.ie;https://cpl.ie;IT & Tech
Galway;Celtic Careers;;Galway;EA3789;0919876543;info@celticcareers.ie;https://celticcareers.ie;Life Sciences`;

        const parse = (text) => Papa.parse(text, {
          header:true, delimiter:';', skipEmptyLines:true,
          complete: (res) => { setAgencies(res.data.filter(r => r.Agency_Name)); setLoading(false); }
        });
        fetch(CSV_DATA_PATH)
          .then(r => { if (!r.ok) throw new Error('no csv'); return r.text(); })
          .then(parse)
          .catch(() => parse(fallback));
      }, []);

      /* ---- persistence ---- */
      useEffect(() => {
        try {
          const saved = JSON.parse(store.get('capolavoro_outreach') || '[]');
          if (Array.isArray(saved)) setSelected(saved);
        } catch (e) {}
      }, []);
      useEffect(() => {
        store.set('capolavoro_outreach', JSON.stringify(selected));
      }, [selected]);

      /* ---- apply route params to the agencies view ---- */
      useEffect(() => {
        if (route.path !== ROUTES.AGENCIES || appliedHash.current === route.raw) return;
        appliedHash.current = route.raw;
        const p = route.params;
        if (p.has('county')) setCounty(p.get('county') || '');
        if (p.has('industry')) setIndustry(p.get('industry') || '');
        if (p.has('q')) { setTerm(p.get('q') || ''); setDTerm(p.get('q') || ''); }
        if (p.has('contact')) {
          const c = p.get('contact');
          setHasEmail(c === 'email'); setHasPhone(c === 'phone'); setHasWebsite(c === 'website');
        }
        setPage(0);
        if (p.get('tour')) setTourStep(0);
        const view = p.get('view');
        if (view) setTimeout(() => {
          const el = document.getElementById(view);
          if (el) el.scrollIntoView({ block:'start', behavior:'smooth' });
        }, 260);
      }, [route]);

      /* ---- first visit tour ---- */
      useEffect(() => {
        if (loading || route.path !== ROUTES.AGENCIES) return;
        if (route.params.get('tour')) return;
        if (store.get('capolavoro_tour_seen')) return;
        const t = setTimeout(() => setTourStep(0), 700);
        return () => clearTimeout(t);
      }, [loading, route.path]);

      useEffect(() => { setNetGroup(county ? 'industry' : 'county'); }, [county]);

      useEffect(() => {
        const t = setTimeout(() => { setDTerm(term); setPage(0); }, 280);
        return () => clearTimeout(t);
      }, [term]);

      useEffect(() => {
        const close = () => { setRowMenu(null); setUserMenu(false); };
        window.addEventListener('click', close);
        return () => window.removeEventListener('click', close);
      }, []);

      /* ---- derived ---- */
      const indexed = useMemo(() => agencies.map((a, i) => ({ ...a, _k:keyOf(a, i) })), [agencies]);

      const data = useMemo(() => {
        const byCounty = {}, fieldCount = {}, fieldsByCounty = {}, mails = new Set();
        indexed.forEach(a => {
          const c = (a.County || '').trim();
          if (c) byCounty[c] = (byCounty[c] || 0) + 1;
          emailsOf(a).forEach(e => mails.add(e.toLowerCase()));
          fieldsOf(a).forEach(f => {
            fieldCount[f] = (fieldCount[f] || 0) + 1;
            if (c) { fieldsByCounty[c] = fieldsByCounty[c] || {}; fieldsByCounty[c][f] = (fieldsByCounty[c][f] || 0) + 1; }
          });
        });
        const topFields = {};
        Object.entries(fieldsByCounty).forEach(([c, m]) => {
          topFields[c] = Object.entries(m).sort((a,b) => b[1] - a[1]).map(e => e[0]);
        });
        return {
          total:indexed.length,
          counties:Object.keys(byCounty).sort(),
          industries:Object.keys(fieldCount).sort(),
          topIndustries:Object.entries(fieldCount).sort((a,b) => b[1] - a[1]).map(e => e[0]),
          byCounty, topFields, emailCount:mails.size
        };
      }, [indexed]);

      const filtered = useMemo(() => {
        const q = dTerm.trim().toLowerCase();
        return indexed.filter(a => {
          if (county && (a.County || '').trim() !== county) return false;
          if (industry && !fieldsOf(a).includes(industry)) return false;
          if (q) {
            const hay = (a.Agency_Name + ' ' + (a.Trading_Name || '') + ' ' + (a.Covered_Fields || '') + ' ' + (a.County || '')).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          if (hasEmail && !emailsOf(a).length) return false;
          if (hasPhone && !a.Phone) return false;
          if (hasWebsite && !a.Website) return false;
          return true;
        });
      }, [indexed, county, industry, dTerm, hasEmail, hasPhone, hasWebsite]);

      const sorted = useMemo(() => {
        const arr = [...filtered];
        if (sort === 'name') arr.sort((a,b) => shortName(a).localeCompare(shortName(b)));
        else if (sort === 'name-desc') arr.sort((a,b) => shortName(b).localeCompare(shortName(a)));
        else if (sort === 'county') arr.sort((a,b) => (a.County||'').localeCompare(b.County||'') || shortName(a).localeCompare(shortName(b)));
        else if (sort === 'quality') arr.sort((a,b) => QUALITY_RANK[qualityOf(a).key] - QUALITY_RANK[qualityOf(b).key]);
        return arr;
      }, [filtered, sort]);

      const pages = Math.max(1, Math.ceil(sorted.length / PER_PAGE));
      const safePage = Math.min(page, pages - 1);
      const rows = sorted.slice(safePage * PER_PAGE, safePage * PER_PAGE + PER_PAGE);
      const rangeFrom = sorted.length ? safePage * PER_PAGE + 1 : 0;
      const rangeTo = Math.min(sorted.length, (safePage + 1) * PER_PAGE);

      const byKey = useMemo(() => { const m = new Map(); indexed.forEach(a => m.set(a._k, a)); return m; }, [indexed]);
      const picked = useMemo(() => selected.map(k => byKey.get(k)).filter(Boolean), [selected, byKey]);
      const pickedEmails = useMemo(() => picked.flatMap(emailsOf).map(e => e.toLowerCase()), [picked]);
      const uniqueEmails = useMemo(() => [...new Set(pickedEmails)], [pickedEmails]);
      const dupes = pickedEmails.length - uniqueEmails.length;

      /* ---- actions ---- */
      const toggle = (k) => setSelected(s => s.includes(k) ? s.filter(x => x !== k) : [...s, k]);
      const allOnPage = rows.length > 0 && rows.every(r => selected.includes(r._k));
      const togglePage = () => {
        const keys = rows.map(r => r._k);
        setSelected(s => allOnPage ? s.filter(k => !keys.includes(k)) : [...new Set([...s, ...keys])]);
      };
      const clearFilters = () => {
        setCounty(''); setIndustry(''); setTerm(''); setDTerm('');
        setHasEmail(false); setHasPhone(false); setHasWebsite(false); setPage(0);
      };
      const copyEmails = () => {
        if (!uniqueEmails.length) return;
        navigator.clipboard.writeText(uniqueEmails.join('; '))
          .then(() => toast('Copied ' + uniqueEmails.length + ' addresses — paste into BCC'))
          .catch(() => toast('Copy failed, try again'));
      };
      const exportCsv = () => {
        if (!picked.length) return;
        const cols = ['County','Agency_Name','Trading_Name','Address','Licence_Number','Phone','Email','Website','Covered_Fields'];
        const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
        const csv = [cols.join(';'), ...picked.map(a => cols.map(c => esc(a[c])).join(';'))].join('\n');
        const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url; a.download = 'capolavoro-outreach-list.csv'; a.click();
        URL.revokeObjectURL(url);
        toast('Exported ' + picked.length + ' agencies');
      };
      const closeTour = () => { setTourStep(null); store.set('capolavoro_tour_seen','1'); };
      const startTour = () => { window.location.hash = href(ROUTES.AGENCIES, { tour:1 }).slice(1); setTourStep(0); };

      const menuItems = (
        <>
          <button onClick={() => { setUserMenu(false); window.location.hash = href(ROUTES.AGENCIES, { view:'outreach' }).slice(1); }}>Open outreach list</button>
          <button onClick={() => { setUserMenu(false); setTplOpen(true); }}>Email templates</button>
          <button onClick={() => { setUserMenu(false); startTour(); }}>Restart tutorial</button>
          <button disabled={!selected.length} onClick={() => { setUserMenu(false); setSelected([]); toast('Outreach list cleared'); }}>Clear outreach list</button>
        </>
      );

      if (loading) {
        return (
          <div className="loading">
            <div className="spinner"></div>
            <p style={{color:'var(--muted)'}}>Loading the agency directory…</p>
          </div>
        );
      }

      const specCount = Math.max(10, Math.floor(data.industries.length / 10) * 10);

      return (
        <>
          <Header
            route={route.path} term={term} setTerm={setTerm}
            onTour={startTour}
            onMenu={() => setUserMenu(v => !v)} menuOpen={userMenu} menuItems={menuItems}
          />

          {route.path === ROUTES.HOME && (
            <HomeView data={data} filters={homeFilters} setFilters={setHomeFilters} />
          )}

          {route.path === ROUTES.RESOURCES && <ResourcesView data={data} />}
          {route.path === ROUTES.ABOUT && <AboutView data={data} />}

          {route.path === ROUTES.AGENCIES && (
            <div className="shell">
              <div className="grid">
                {/* Filters */}
                <div className="col col-side col-left">
                  <aside className="card filters sticky" data-tour="filters">
                    <div className="filters-head">
                      <h3>Filters</h3>
                      <button className="link-clear" onClick={clearFilters}>Clear all</button>
                    </div>
                    <div className="field">
                      <label htmlFor="f-county">County</label>
                      <div className="select-wrap">
                        {I.pin({s:15})}
                        <select id="f-county" value={county} onChange={e => { setCounty(e.target.value); setPage(0); }}>
                          <option value="">All Counties</option>
                          {data.counties.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="field">
                      <label htmlFor="f-ind">Industry</label>
                      <div className="select-wrap">
                        {I.briefcase({s:15})}
                        <select id="f-ind" value={industry} onChange={e => { setIndustry(e.target.value); setPage(0); }}>
                          <option value="">All Industries</option>
                          {data.industries.map(f => <option key={f} value={f}>{f}</option>)}
                        </select>
                      </div>
                    </div>
                    <h4>Contact information</h4>
                    <label className="check"><input type="checkbox" checked={hasEmail} onChange={e => { setHasEmail(e.target.checked); setPage(0); }} /> Has Email</label>
                    <label className="check"><input type="checkbox" checked={hasPhone} onChange={e => { setHasPhone(e.target.checked); setPage(0); }} /> Has Phone</label>
                    <label className="check"><input type="checkbox" checked={hasWebsite} onChange={e => { setHasWebsite(e.target.checked); setPage(0); }} /> Has Website</label>
                    <div className="divider"></div>
                    <div className="map-title">Agency location</div>
                    <AgencyMap agencies={filtered} />
                  </aside>
                </div>

                {/* Results + templates */}
                <div className="col">
                  {viewMode === 'map' ? (
                  <section className="card" id="results" data-tour="results">
                    <div className="results-head">
                      <div className="seg">
                        <button className={viewMode === 'list' ? 'on' : ''} onClick={() => setViewMode('list')} aria-pressed={viewMode === 'list'}>
                          {I.list({s:16})} List
                        </button>
                        <button className={viewMode === 'map' ? 'on' : ''} onClick={() => setViewMode('map')} aria-pressed={viewMode === 'map'}>
                          {I.nodes({s:16})} Network
                        </button>
                      </div>
                      <div className="head-tools">
                        <span className="sort-lbl">Group by</span>
                        <div className="seg seg-sm">
                          <button className={netGroup === 'county' ? 'on' : ''} onClick={() => setNetGroup('county')} aria-pressed={netGroup === 'county'}>
                            {I.pin({s:15, c:'currentColor'})} Geography
                          </button>
                          <button className={netGroup === 'industry' ? 'on' : ''} onClick={() => setNetGroup('industry')} aria-pressed={netGroup === 'industry'}>
                            {I.briefcase({s:15, c:'currentColor'})} Industry
                          </button>
                        </div>
                      </div>
                    </div>
                    <NetworkGraph agencies={sorted} county={county} groupBy={netGroup} selected={selected} onToggle={toggle} />
                  </section>
                  ) : (
                  <section className="card" id="results" data-tour="results">
                    <div className="results-head">
                      <div className="seg">
                        <button className={viewMode === 'list' ? 'on' : ''} onClick={() => setViewMode('list')} aria-pressed={viewMode === 'list'}>
                          {I.list({s:16})} List
                        </button>
                        <button className={viewMode === 'map' ? 'on' : ''} onClick={() => setViewMode('map')} aria-pressed={viewMode === 'map'}>
                          {I.nodes({s:16})} Network
                        </button>
                      </div>
                      <div className="head-tools">
                        <span className="sort-lbl">Sort by</span>
                        <div className="sort-wrap">
                          <select value={sort} onChange={e => setSort(e.target.value)} aria-label="Sort agencies">
                            <option value="relevance">Relevance</option>
                            <option value="name">Name A–Z</option>
                            <option value="name-desc">Name Z–A</option>
                            <option value="county">County</option>
                            <option value="quality">Email quality</option>
                          </select>
                        </div>
                        <div className="pager">
                          <span>{rangeFrom}–{rangeTo} of {sorted.length}</span>
                          <button onClick={() => setPage(p => Math.max(0, p - 1))} disabled={safePage === 0} aria-label="Previous page">{I.chevL()}</button>
                          <button onClick={() => setPage(p => Math.min(pages - 1, p + 1))} disabled={safePage >= pages - 1} aria-label="Next page">{I.chevR({s:16})}</button>
                        </div>
                      </div>
                    </div>

                    {rows.length === 0 ? (
                      <div className="empty">
                        <strong>No agencies match these filters</strong>
                        Widen the county or industry, or clear the filters to start again.
                      </div>
                    ) : (
                      <div className="table-scroll">
                        <table>
                          <thead>
                            <tr>
                              <th><label className="check" style={{padding:0}}><input type="checkbox" checked={allOnPage} onChange={togglePage} aria-label="Select all on this page" /></label></th>
                              <th>Agency</th><th>Location</th><th>Specialisations</th><th>Contact</th><th>Email quality</th><th style={{width:40}}></th>
                            </tr>
                          </thead>
                          <tbody>
                            {rows.map(a => {
                              const q = qualityOf(a), fields = fieldsOf(a), main = fields[0];
                              const colors = main ? pillColor(main) : null;
                              const on = selected.includes(a._k), mails = emailsOf(a);
                              return (
                                <tr key={a._k} className={on ? 'picked' : ''}>
                                  <td><label className="check" style={{padding:0}}><input type="checkbox" checked={on} onChange={() => toggle(a._k)} aria-label={'Add ' + shortName(a) + ' to outreach list'} /></label></td>
                                  <td>
                                    <div className="ag-name">{shortName(a)}</div>
                                    <div className="ag-lic">License: {a.Licence_Number || '—'}</div>
                                  </td>
                                  <td><div className="cell-loc">{I.pin({s:14})} {a.County || '—'}</div></td>
                                  <td>
                                    {main
                                      ? <><span className="pill" style={{background:colors[0], color:colors[1]}}>{main}</span>
                                          {fields.length > 1 && <span className="pill-more">+{fields.length - 1}</span>}</>
                                      : <span className="pill" style={{background:'#F1F5F4', color:'#7C8F94'}}>Not listed</span>}
                                  </td>
                                  <td>
                                    <div className="cell-contact">
                                      {a.Phone && <span className="contact-line">{I.phone({s:14})} {formatPhone(a.Phone)}</span>}
                                      {a.Website && <a className="web-link" href={cleanUrl(a.Website)} target="_blank" rel="noopener noreferrer">{I.globe({s:14})} Visit Website</a>}
                                      {!a.Phone && !a.Website && <span style={{color:'var(--muted-2)',fontSize:13}}>—</span>}
                                    </div>
                                  </td>
                                  <td><span className={'quality q-' + q.key} title={mails[0] || 'No email on file'}><i></i>{q.short}</span></td>
                                  <td>
                                    <div className="row-menu-wrap" onClick={e => e.stopPropagation()}>
                                      <button className="kebab" onClick={() => setRowMenu(rowMenu === a._k ? null : a._k)} aria-label="Row actions">{I.dots({s:16})}</button>
                                      {rowMenu === a._k && (
                                        <div className="menu" style={{right:0, top:32}}>
                                          <button onClick={() => { toggle(a._k); setRowMenu(null); }}>{on ? 'Remove from outreach list' : 'Add to outreach list'}</button>
                                          <button disabled={!mails.length} onClick={() => { navigator.clipboard.writeText(mails.join('; ')); setRowMenu(null); toast('Email copied'); }}>Copy email</button>
                                          <button disabled={!a.Phone} onClick={() => { navigator.clipboard.writeText(formatPhone(a.Phone)); setRowMenu(null); toast('Phone copied'); }}>Copy phone</button>
                                          <button onClick={() => { navigator.clipboard.writeText(a.Address || ''); setRowMenu(null); toast('Address copied'); }}>Copy address</button>
                                        </div>
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </section>
                  )}

                  <section className="card tpl" id="templates">
                    <div className="tpl-head">
                      <div>
                        <h3>Email templates</h3>
                        <p>Save time with proven templates. Personalise and start conversations that get responses.</p>
                      </div>
                      <button className="tpl-all" onClick={() => setTplOpen(true)}>View all templates {I.arrow({s:15})}</button>
                    </div>
                    <div className="tpl-grid">
                      {TEMPLATES.map(t => (
                        <button key={t.id} className={'tpl-card' + (t.id === templateId ? ' on' : '')} onClick={() => { setTemplateId(t.id); setTplOpen(true); }}>
                          <span className="tpl-ico">{I.envSm({c:'#0B7B5B'})}</span>
                          <span>
                            <b>{t.name}{t.recommended && <span className="badge-rec">Recommended</span>}</b>
                            <small>{t.blurb}</small>
                          </span>
                        </button>
                      ))}
                    </div>
                  </section>
                </div>

                {/* Outreach */}
                <div className="col col-side col-right">
                  <aside className="card out sticky" id="outreach" data-tour="outreach">
                    <div className="out-head">
                      <h3>Outreach list</h3>
                      <span className="count-badge">{picked.length}</span>
                      {picked.length > 0 && <button className="out-clear" onClick={() => setSelected([])}>Clear all</button>}
                    </div>

                    {picked.length === 0 ? (
                      <div className="out-empty">Tick an agency in the results table and it lands here, ready to copy or export.</div>
                    ) : (
                      <div className="out-list">
                        {picked.map(a => {
                          const q = qualityOf(a);
                          return (
                            <div className="out-item" key={a._k}>
                              <span className="out-dot" style={{background:QUALITY_DOT[q.key]}}></span>
                              <div style={{minWidth:0}}>
                                <b>{shortName(a)}</b>
                                <span>{q.key === 'none' ? 'No email on file' : q.label + ' quality email'}</span>
                              </div>
                              <button className="out-x" onClick={() => toggle(a._k)} aria-label={'Remove ' + shortName(a)}>{I.x({s:14})}</button>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {dupes > 0 && (
                      <div className="dedupe">
                        <div style={{flex:'none',marginTop:1}}>{I.check({s:18})}</div>
                        <div>
                          <b>Duplicate emails removed</b>
                          <span>{dupes} duplicate{dupes > 1 ? 's were' : ' was'} automatically filtered out from your selection.</span>
                        </div>
                      </div>
                    )}

                    <div className="out-actions">
                      <button className="btn btn-primary" data-tour="copy" onClick={copyEmails} disabled={!uniqueEmails.length}>
                        {I.copy({s:17,c:'#fff'})} Copy emails ({uniqueEmails.length})
                      </button>
                      <button className="btn btn-ghost" onClick={exportCsv} disabled={!picked.length}>
                        {I.download({s:17})} Export CSV ({picked.length})
                      </button>
                    </div>
                  </aside>
                </div>
              </div>
            </div>
          )}

          <Footer />

          <TemplateModal open={tplOpen} onClose={() => setTplOpen(false)} templateId={templateId} setTemplateId={setTemplateId} picked={picked} toast={toast} />

          {tourStep !== null && route.path === ROUTES.AGENCIES && (
            <Tour
              step={tourStep} total={TOUR_STEPS.length} count={data.total}
              onNext={() => tourStep === TOUR_STEPS.length - 1 ? closeTour() : setTourStep(s => s + 1)}
              onBack={() => setTourStep(s => Math.max(0, s - 1))}
              onClose={closeTour}
            />
          )}

          {msg && <div className="toast">{I.check({s:17,c:'#7BE0B5'})} {msg}</div>}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
